<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Formulaire de candidature - Ingénieur systèmes embarqués</title></head>
<body><main><h1>Formulaire de candidature</h1><p>Les candidatures non envoyées sont enregistrées automatiquement.</p>
<form action="/jobs/100/apply" method="post" enctype="multipart/form-data">
  <label for="name">Prénom *</label><input id="name" name="first_name" value="Camille" required>
  <label for="last">Nom *</label><input id="last" name="last_name" required>
  <label for="cv">CV *</label><input id="cv" type="file" name="cv" required>
  <label><input type="checkbox" name="consent" required> J'accepte la politique de confidentialité *</label>
  <button>Envoyer ma candidature</button></form>
</main></body></html>
