<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Dépôt du CV</title></head>
<body><h1>Déposez votre CV</h1>
<form method="post" action="/apply" enctype="multipart/form-data">
 <label for="cv">CV *</label><input type="file" id="cv" name="cv"
   onchange="fetch('/apply', {method: 'POST', body: new FormData(this.form)})">
 <button type="button">Suivant</button>
</form></body></html>
