<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Candidature</title></head>
<body><h1>Votre candidature</h1>
<form method="post" action="/apply">
 <label for="fn">Prénom *</label><input id="fn" name="first_name" required>
 <fieldset><legend>Téléphone mobile</legend>
  <label for="cc">Choix</label><select id="cc" name="cc" required><option value="33" selected>+33</option><option value="32">+32</option></select>
  <label for="tel">Numéro</label><input type="tel" id="tel" name="phone"></fieldset>
 <label for="nat">Pays de nationalité *</label>
 <select id="nat" name="nat" required><option value="fr" selected>France</option><option value="be">Belgique</option></select>
 <button type="submit">Envoyer ma candidature</button>
</form></body></html>
