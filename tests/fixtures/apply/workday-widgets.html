<!doctype html><meta charset="utf-8"><title>Synthetic Workday choices</title>
<section><h1>My Information</h1>
<form method="post">
  <div id="source" data-automation-id="sourcePrompt" role="combobox" aria-label="How did you hear about us?" aria-controls="sources">Select</div>
  <ul id="sources" role="listbox" hidden><li role="option">Referral</li><li role="option">University</li></ul>
  <button type="submit">Send manually</button>
</form>
</section>
<script>
(() => {
  const control = document.querySelector('#source');
  const options = document.querySelector('#sources');
  document.body.dataset.clicks = '';
  control.addEventListener('click', () => { document.body.dataset.clicks = 'open'; options.hidden = false; });
  options.addEventListener('click', event => {
    document.body.dataset.clicks += ' choose'; control.textContent = event.target.textContent; options.hidden = true;
    if (document.body.dataset.autosave === 'true') void fetch('/undeclared-autosave', { method: 'POST', body: control.textContent });
  });
})();
</script>
