<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Localisation</title></head>
<body><h1>Où souhaitez-vous travailler ?</h1>
<form method="post" action="/apply">
 <label for="city">Ville souhaitée *</label>
 <input id="city" role="combobox" aria-expanded="false" aria-controls="lb" autocomplete="off" required>
 <ul id="lb" role="listbox" hidden style="margin:0;padding:0;list-style:none">
  <li role="option">Paris</li><li role="option">Lyon</li><li role="option">Toulouse</li></ul>
 <button type="submit">Envoyer ma candidature</button>
</form>
<script>
const i=document.getElementById('city'), lb=document.getElementById('lb');
const show=()=>{const q=i.value.toLowerCase();lb.hidden=false;for(const o of lb.children)o.hidden=!o.textContent.toLowerCase().includes(q);};
i.addEventListener('focus',show);i.addEventListener('click',show);i.addEventListener('input',show);
lb.addEventListener('click',e=>{if(e.target.matches('[role=option]')){i.value=e.target.textContent;lb.hidden=true;}});
</script></body></html>
