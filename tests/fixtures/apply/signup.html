<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Créer un compte</title></head>
<body><h1>Créez votre compte candidat</h1>
<form method="post" action="/signup">
 <label for="ae">Adresse e-mail *</label><input type="email" id="ae" name="email" required>
 <label for="pw">Mot de passe *</label><input type="password" id="pw" name="password" required>
 <label for="pw2">Confirmez le mot de passe *</label><input type="password" id="pw2" name="password2" required>
 <button type="submit">Créer mon compte</button>
</form></body></html>
