<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Candidature</title>
<style>#banner{border:1px solid #000;padding:8px}</style></head>
<body><div id="banner" role="dialog"><p>Nous utilisons des cookies.</p>
 <button type="button" onclick="document.getElementById('banner').remove()">Tout refuser</button>
 <button type="button" onclick="document.getElementById('banner').remove()">Accepter et envoyer</button></div>
<h1>Votre candidature</h1>
<form method="post" action="/apply" enctype="multipart/form-data">
 <label for="fn">Prénom *</label><input id="fn" name="first_name" required>
 <label for="ln">Nom *</label><input id="ln" name="last_name" required>
 <label for="em">E-mail *</label><input type="email" id="em" name="email" required>
 <button type="submit">Envoyer ma candidature</button>
</form></body></html>
