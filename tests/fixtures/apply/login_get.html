<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Connexion</title></head>
<body><h1>Connexion candidat</h1>
<form method="get" action="/login_get">
 <label for="ae">Adresse e-mail *</label><input type="email" id="ae" name="email" required>
 <label for="pw">Mot de passe *</label><input type="password" id="pw" name="password" required>
 <button type="submit">Se connecter</button>
</form>
<p id="echo"></p>
<div id="reveal"></div>
<script>
// a sloppy site: shows the query string back and a "show password" text field
const q = new URLSearchParams(location.search);
if (q.has('password')) {
  document.getElementById('echo').textContent = 'Dernière tentative : ' + decodeURIComponent(location.search.slice(1));
  document.getElementById('reveal').innerHTML = '<label for="shown">Mot de passe saisi</label><input type="text" id="shown">';
  document.getElementById('shown').value = q.get('password');
}
</script></body></html>
