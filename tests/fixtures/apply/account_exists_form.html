<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Ingénieur systèmes embarqués - Postuler</title></head>
<body><main><h1>Ingénieur systèmes embarqués</h1>
<p>Cette adresse e-mail est déjà inscrite : connectez-vous pour envoyer votre candidature.</p>
<form action="/login" method="post"><h2>Déjà inscrit</h2>
  <label for="login">Identifiant</label><input id="login" name="Login">
  <label for="password">Mot de passe du compte</label><input id="password" type="password" name="Password">
  <button>Se connecter</button></form>
<form action="/jobs/100/apply" method="post" enctype="multipart/form-data">
  <label for="mail">Adresse e-mail</label><input id="mail" name="email" value="camille@example.test">
  <label for="new">Choisir un mot de passe</label><input id="new" type="password" name="new_password">
  <label for="name">Prénom</label><input id="name" name="first_name" value="Camille">
  <label for="cv">CV</label><input id="cv" type="file" name="cv"><button>Envoyer</button></form>
</main></body></html>
