[project]
name = "jobhunt"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Khalyl Konkobo", email = "58838718+kkonkobo@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.9.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.1",
    "firecrawl-py>=4.57.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.52.0",
    "patchright>=1.64.4",
    "pydantic>=2.14.3",
    "python-jobspy>=1.4.1",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jobhunt = "jobhunt:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]
