{% macro launch_supervised(app_id, rev, origin_sha) %}
<form method="post" action="/applications/{{ app_id }}/apply/supervised"
      onsubmit="return confirm('Ouvrir le site en mode supervisé ? La saisie et le dépôt du CV peuvent transmettre des données avant le clic final. Vous seul décidez de cliquer sur Envoyer.')">
  <input type="hidden" name="rev" value="{{ rev }}">
  <input type="hidden" name="origin" value="{{ origin_sha }}">
  <button class="btn">Ouvrir en mode supervisé</button>
</form>
{% endmacro %}
