{% extends "base.html" %}
{% block title %}{{ "Modifier le profil" if profile else "Nouveau profil" }}{% endblock %}
{% block content %}
<h1>{{ "Modifier le profil" if profile else "Nouveau profil" }}</h1>
<form method="post" action="{{ '/profiles/%d' % profile.id if profile else '/profiles' }}" class="form">
  <label>Nom du proche
    <input name="name" required value="{{ profile.name if profile else '' }}"></label>
  <label>Filière / fonction recherchée
    <input name="headline" required value="{{ profile.headline if profile else '' }}"
      placeholder="Étudiant 2e année ingénieur mécatronique">
    <small>Décrivez une fonction ou une filière, pas un intitulé de poste : l'outil en déduit les métiers voisins.</small></label>
  <label>Centres d'intérêt (un par ligne ou séparés par des virgules)
    <textarea name="interests" rows="3" placeholder="systèmes embarqués, programmation bas niveau">{{ profile.interests|join("\n") if profile else '' }}</textarea></label>
  <label>Formation
    <input name="education" value="{{ (profile.education or '') if profile else '' }}"></label>
  <div class="grid2">
    <label>Années d'expérience
      <input name="experience_years" type="number" step="0.5" min="0" value="{{ profile.experience_years if profile and profile.experience_years is not none else '' }}"></label>
    <label>Rayon (km)
      <input name="radius_km" type="number" min="0" value="{{ profile.radius_km if profile and profile.radius_km is not none else '' }}"></label>
  </div>
  <label>Compétences
    <textarea name="skills" rows="2" placeholder="C, STM32, Python">{{ profile.skills|join(", ") if profile else '' }}</textarea></label>
  <fieldset><legend>Types de contrat</legend>
    {% for c in FORM_CONTRACTS %}
      <label class="check"><input type="checkbox" name="contract_types" value="{{ c }}"
        {% if profile and c in profile.contract_types|map(attribute='value') %}checked{% endif %}> {{ CONTRACT_LABELS[c] }}</label>
    {% endfor %}
  </fieldset>
  <label>Lieux (« remote » pour le télétravail)
    <textarea name="locations" rows="2" placeholder="Toulouse, Montpellier, remote">{{ profile.locations|join(", ") if profile else '' }}</textarea></label>
  <label>Langues
    <input name="languages" value="{{ profile.languages|join(', ') if profile else 'fr' }}"></label>
  <label>Notes pour l'IA
    <textarea name="notes" rows="2" placeholder="disponible à partir de juin, pas de déplacements">{{ (profile.notes or '') if profile else '' }}</textarea></label>
  <label>CV (coller le texte)
    <textarea name="cv_text" rows="10">{{ (profile.cv_text or '') if profile else '' }}</textarea></label>
  <div class="grid2">
    <label>E-mail <input name="email" type="email" value="{{ (profile.email or '') if profile else '' }}"></label>
    <label>Téléphone <input name="phone" value="{{ (profile.phone or '') if profile else '' }}"></label>
  </div>
  <p><button class="btn primary" type="submit">Enregistrer</button>
     <a class="btn" href="{{ '/profiles/%d' % profile.id if profile else '/' }}">Annuler</a></p>
</form>
{% endblock %}
