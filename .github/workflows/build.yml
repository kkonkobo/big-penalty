name: Build desktop app

# Every push to main and every pull request: test, then build the desktop app on Windows and macOS.
# The builds are downloadable from the run's Artifacts. Pushing a tag like v0.1.0 also publishes them
# as a GitHub Release. PyInstaller can't cross-compile, so each OS builds on its own runner.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group package

      - name: Test
        # Same UTF-8 mode as the packaged app (big_penalty.spec); without it Windows reads files as cp1252.
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -q

      - name: Build
        run: uv run --group package pyinstaller packaging/big_penalty.spec --noconfirm

      # Starts the packaged app without a window: serves the UI, starts the browser driver,
      # and launches Chrome if installed. Catches anything the bundle is missing on this platform.
      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        env:
          JOBHUNT_DATA_DIR: ${{ runner.temp }}/jobhunt-data
        run: |
          "dist/Big Penalty.app/Contents/MacOS/Big Penalty" --self-test selftest.json || status=$?
          cat selftest.json
          exit ${status:-0}

      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JOBHUNT_DATA_DIR: ${{ runner.temp }}\jobhunt-data
        run: |
          & "dist/Big Penalty/big-penalty-cli.exe" --self-test selftest.json
          $status = $LASTEXITCODE
          if (Test-Path selftest.json) { Get-Content selftest.json } else { Write-Host "no report written" }
          exit $status

      # Opens the real native window (WebKit / WebView2) and checks the UI loads in it. Informational:
      # hosted runners don't always have a usable desktop session.
      - name: Native window check (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          JOBHUNT_DATA_DIR: ${{ runner.temp }}/jobhunt-data
        run: |
          "dist/Big Penalty.app/Contents/MacOS/Big Penalty" --self-test-window window.json || status=$?
          cat window.json || true
          exit ${status:-0}

      - name: Native window check (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          JOBHUNT_DATA_DIR: ${{ runner.temp }}\jobhunt-data
        run: |
          $p = Start-Process -FilePath "dist/Big Penalty/Big Penalty.exe" -WorkingDirectory $PWD `
            -ArgumentList '--self-test-window', 'window.json' -Wait -PassThru
          if (Test-Path window.json) { Get-Content window.json } else { Write-Host "no report written" }
          exit $p.ExitCode

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          $version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\Big-Penalty-windows-x64-setup.exe" "Big-Penalty-${{ matrix.name }}-setup.exe"

      # Installs silently, runs the installed app's self-test, then uninstalls.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JOBHUNT_DATA_DIR: ${{ runner.temp }}\jobhunt-data
        run: |
          $setup = "Big-Penalty-${{ matrix.name }}-setup.exe"
          $app = Join-Path $env:LOCALAPPDATA "Programs\Big Penalty"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "installer exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $app "Big Penalty.exe"))) { Get-Content install.log -Tail 40; throw "app not installed in $app" }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Big Penalty.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start-menu shortcut missing" }
          & (Join-Path $app "big-penalty-cli.exe") --self-test selftest-installed.json
          $status = $LASTEXITCODE
          Get-Content selftest-installed.json
          if ($status -ne 0) { throw "installed app failed its self-test" }
          $u = Start-Process (Join-Path $app "unins000.exe") -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks and ad-hoc signature intact; plain zip breaks them.
        run: ditto -c -k --keepParent "dist/Big Penalty.app" "Big-Penalty-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Big Penalty" -DestinationPath "Big-Penalty-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Big-Penalty-${{ matrix.name }}
          path: |
            Big-Penalty-${{ matrix.name }}.zip
            Big-Penalty-${{ matrix.name }}-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Big-Penalty-*.zip
            Big-Penalty-*-setup.exe
          generate_release_notes: true
