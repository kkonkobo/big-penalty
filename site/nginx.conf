server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The portal shares this web origin (portal/DESIGN.md section 12): no inline script or style, no third party but
    # the GitHub API call of the release lookup. nginx drops every server-level add_header in a location that has
    # its own add_header, so the security headers are repeated in each such location below. Keep them identical.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src https://api.github.com; img-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;

    # Stable links to share: they always lead to the newest release on GitHub.
    location = /download/windows          { return 302 https://github.com/kkonkobo/big-penalty/releases/latest/download/Big-Penalty-windows-x64-setup.exe; }
    # No installation needed: unzip and run.
    location = /download/windows-portable { return 302 https://github.com/kkonkobo/big-penalty/releases/latest/download/Big-Penalty-windows-x64.zip; }
    location = /download/mac              { return 302 https://github.com/kkonkobo/big-penalty/releases/latest/download/Big-Penalty-macos-arm64.zip; }
    location = /download/mac-intel        { return 302 https://github.com/kkonkobo/big-penalty/releases/latest/download/Big-Penalty-macos-intel.zip; }

    location = /latest { return 302 https://github.com/kkonkobo/big-penalty/releases/latest; }

    location = /health { default_type text/plain; return 200 "ok\n"; }

    # Which commit this container was built from; the deploy workflow checks it.
    location = /version.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src https://api.github.com; img-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
    }

    location /assets/ { expires 7d; }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src https://api.github.com; img-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }
}
